<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Armchair Metropolist</title>
  <desc id="description">A city skyline rising from a turquoise armchair</desc>

  <defs>
    <linearGradient id="background" x1="256" y1="40" x2="256" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#253653" />
      <stop offset="1" stop-color="#1d4632" />
    </linearGradient>
    <linearGradient id="city" x1="168" y1="116" x2="340" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb44a" />
      <stop offset="1" stop-color="#f47a32" />
    </linearGradient>
    <linearGradient id="seat" x1="256" y1="288" x2="256" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8fd3e8" />
      <stop offset="1" stop-color="#6ab8d1" />
    </linearGradient>
    <linearGradient id="armrest" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff9238" />
      <stop offset="1" stop-color="#e9672f" />
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#background)" />
  <rect
    x="39"
    y="39"
    width="434"
    height="434"
    rx="98"
    fill="none"
    stroke="#405474"
    stroke-width="6"
  />

  <g fill="#ffe2a0">
    <path d="m104 82 4 12 12 4-12 4-4 12-4-12-12-4 12-4Z" />
    <path d="m161 78 2.5 7.5L171 88l-7.5 2.5L161 98l-2.5-7.5L151 88l7.5-2.5Z" />
    <path d="m224 94 3 9 9 3-9 3-3 9-3-9-9-3 9-3Z" />
    <path d="m389 77 3.5 10.5L403 91l-10.5 3.5L389 105l-3.5-10.5L375 91l10.5-3.5Z" />
    <path d="m422 130 2.5 7.5 7.5 2.5-7.5 2.5-2.5 7.5-2.5-7.5-7.5-2.5 7.5-2.5Z" />
  </g>

  <!-- The chair back is a skyline: the city literally sits in the armchair. -->
  <path
    fill="url(#city)"
    d="M132 320V194h50v-55h58v82h42V108h66v58h40v154Z"
  />
  <path fill="#ffd887" d="M151 216h13v17h-13zm0 35h13v17h-13zm52-88h14v18h-14zm0 38h14v18h-14zm99-65h15v19h-15zm0 40h15v19h-15zm0 40h15v19h-15zm48-26h14v18h-14zm0 38h14v18h-14z" />

  <!-- The legs sit behind a distinct seat base, so the cushion never overlaps them. -->
  <path fill="#d85f2c" d="M132 382h58l-12 58h-62zm190 0h58l16 58h-62z" />

  <!-- Broad arms and a single cushion keep the silhouette readable at 32 px. -->
  <rect x="88" y="278" width="92" height="136" rx="44" fill="url(#armrest)" />
  <rect x="332" y="278" width="92" height="136" rx="44" fill="url(#armrest)" />
  <rect x="128" y="364" width="256" height="46" rx="18" fill="#d85f2c" />
  <path
    fill="url(#seat)"
    d="M152 300c26-12 52-12 78 0s52 12 78 0c20-9 36-9 52-2v56c0 18-14 32-32 32H184c-18 0-32-14-32-32Z"
  />
</svg>
