name: CI

on:
  push:
    branches: [main]
    # `v*` rather than a semver glob. GitHub's syntax page says filter patterns
    # accept `*`, `**`, `+`, `?` and `!`, but the cheat sheet defining whether `+`
    # means "one or more", whether `[0-9]` classes work, and whether `.` stays
    # literal could not be confirmed — and a trigger that silently never fires is
    # the worst failure available here. So the glob stays coarse and deliberately
    # over-matches; the precise check is `release_tag_site/0` in mix.exs, which is
    # unit-testable. A `v`-prefixed non-release tag therefore fails `check` loudly,
    # which is the right outcome for a tag that looks like a release and is not.
    #
    # The repository's existing non-version tag, `backup-pre-squash`, does not
    # start with `v` and is excluded.
    tags: ['v*']
  pull_request:
  # Manual runs build the bundles — .deb and Flatpak — and upload them, without
  # publishing or deploying anything: `release` requires a tag ref and `deploy`
  # requires a push event, so a dispatch run satisfies neither. That is the loop for
  # working on packaging, and afterwards it is how you check the bundles still build
  # after a runtime or toolchain bump without cutting a release.
  workflow_dispatch:

# A force-push or a quick follow-up commit makes the previous run's answer
# irrelevant, so stop it rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `mix check` is the project's whole quality gate, defined once in mix.exs:
  #   format --check-formatted
  #   compile --force --warnings-as-errors   <- also what enforces `boundary`,
  #                                             whose violations are warnings
  #   test --cover                           <- enforces the 90% threshold
  # CI calls that alias rather than restating its parts, so the gate cannot drift
  # between a laptop and a runner. The one exception is the floor version, which
  # skips the format check for the reason given in the matrix below.
  check:
    name: check · Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04

    # Empty on every branch push and pull request — Actions cannot conditionally
    # omit a variable, and mix.exs reads "" as "no tag" for exactly that reason.
    # On a tag this makes check_versions/1 compare the tag against all four
    # declared versions, so a tag that disagrees fails here; `release` needs this
    # job, so nothing is published.
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    strategy:
      # Both versions' results are wanted: "fails only on the floor" and "fails
      # everywhere" call for different fixes.
      fail-fast: false
      matrix:
        include:
          # The floor declared in mix.exs. This entry is the point of the matrix:
          # a floor that nothing builds is a guess, and this project has now twice
          # shipped code that did not exist in the version it claimed to support —
          # `Enum.sum_by/2` under a 1.17 claim, then the `E` regex modifier under a
          # 1.18 one. Both times this entry is what caught it. Keep it pinned to the
          # exact floor `mix.exs` declares, patch version included: `E` (`:export`)
          # arrived in 1.19.3, so 1.19.0 here would pass a floor that is a lie.
          #
          # It runs the gate *without* the format check. Elixir's formatter output
          # changes between versions, so checking 1.20-formatted code under the floor
          # tests the formatter rather than this project — a failure there would be
          # noise. A warnings-as-errors compile failure on the floor is real signal
          # and is still enforced.
          - elixir: "1.19.3"
            otp: "27.3"
            gate: mix do compile --force --warnings-as-errors + test --cover
          # The version actually developed against: the full gate, identical to
          # what `mix check` runs on a laptop.
          - elixir: "1.20.2"
            otp: "29.0.3"
            gate: mix check

    services:
      # The domain and use-case layers are pure and need nothing, but the Ecto
      # adapter's tests run against real Postgres on purpose — an adapter tested
      # only through a stub is a stub test. Credentials match config/test.exs.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # Keyed on the lock file and the exact version pair: build artefacts are
      # not portable between OTP versions, and a stale _build is worse than none.
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get

      # Catches a dependency removed from mix.exs but left in mix.lock. Cheap,
      # and `mix precommit` already runs the mutating form locally.
      - run: mix deps.unlock --check-unused

      - run: ${{ matrix.gate }}
        env:
          MIX_ENV: test

  # The documented answer to Linux cross-compilation: build each target on its
  # own architecture instead. Cross-compiling Linux from macOS fails at Zig's
  # link step (`compile exe desktop ReleaseSmall x86_64-linux 1 errors`), and
  # `burrito_targets/0` in mix.exs defaults to the host target alone — so each
  # runner below produces exactly one binary, its own, with no cross-compiling.
  desktop:
    name: desktop release · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    # Job-wide, not per-step: deps are fetched with `--only prod`, so any mix
    # invocation that fell back to the dev env would fail on a dev-only dep it
    # never downloaded (phoenix_live_reload). That includes `mix assets.setup`.
    env:
      MIX_ENV: prod
      # Whether this leg also builds the *bundle* — a runnable application — on top of
      # the sidecar. Stated once because five steps below share it.
      #
      # A Tauri release build compiles 338 crates against a target directory too large
      # to cache (2.3 GB against a 10 GB repository budget already holding four mix
      # caches), taking this job from ~1 minute to an estimated 9-15. So it is confined
      # to one arch on pushes to main: pull requests keep the fast sidecar-only job, and
      # aarch64 keeps it always — Tauri publishes no prebuilt cargo-tauri for that
      # triple, so bundling there would additionally need a multi-minute cargo install.
      #
      # Nothing waits on this: `deploy` needs only `check`, which finishes in ~50s.
      #
      # Tags bundle too, because a Release carries the .deb. Pushes to main still
      # build and verify it — that is what catches packaging breakage at merge time
      # rather than while cutting a release — but no longer upload it.
      #
      # Manual runs bundle as well, so packaging can be exercised outside a release.
      #
      # This gate now also governs the Flatpak, which is built from the .deb further
      # down in this same job.
      BUNDLE: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag'))) && matrix.target == 'x86_64-unknown-linux-gnu' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.3"

      # Burrito shells out to `zig build` for every build, native included —
      # ex_tauri's docs claiming Zig is cross-compilation-only are wrong. 0.16.0
      # is what Burrito 1.6 targets.
      #
      # The only action here still declaring `using: node20`, so it is the sole
      # remaining source of CI's Node.js 20 deprecation warning. That is not a
      # version we are behind on: v2.2.1 is the newest tag upstream has and it
      # declares node20 too, the repository has issues disabled and no open PRs,
      # and its last commit was 2026-01-19. GitHub forces node20 actions onto the
      # node24 runtime anyway, so the warning is cosmetic — bumping the pin below
      # cannot silence it, and only an upstream release will. (Checked 2026-08-02.)
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-prod-${{ matrix.target }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-prod-${{ matrix.target }}-

      - run: mix deps.get --only prod

      # Installs the tailwind and esbuild binaries. The release's `build_assets`
      # step needs them: `:assemble` only *copies* priv/static, whose contents
      # are gitignored, so a release built without this ships no CSS and no JS.
      - run: mix assets.setup

      - name: Build the Burrito release
        run: mix release desktop --overwrite

      # An existing file is not a working binary, but a *wrong-architecture* file
      # is a silent failure worth catching here rather than on a user's machine.
      - name: Verify the binary is present and native
        run: |
          BIN="burrito_out/desktop_${{ matrix.target }}"
          test -f "$BIN" || { echo "::error::$BIN was not produced"; ls -la burrito_out/ || true; exit 1; }
          file "$BIN"
          case "${{ matrix.target }}" in
            x86_64-*)  file "$BIN" | grep -q 'x86-64'  || { echo "::error::not x86-64"; exit 1; } ;;
            aarch64-*) file "$BIN" | grep -q 'aarch64' || { echo "::error::not aarch64"; exit 1; } ;;
          esac
          echo "size: $(du -h "$BIN" | cut -f1)"

      # The binary is the artefact worth keeping; the .app/.dmg bundles are
      # macOS-only and are not built here.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: burrito_out/desktop_${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------------------
      # The bundle. Everything below produces a runnable Linux application; everything
      # above produces the sidecar it wraps.
      #
      # The sidecar steps stay unconditional and first on purpose. `mix ex_tauri.build`
      # re-runs `mix release desktop` internally (ExTauri.wrap/0, deps/ex_tauri/lib/
      # ex_tauri.ex:245), so this duplicates ~69s of Burrito work on this one path. That
      # is the price of a wrapper failure never being able to take the sidecar's arch
      # check and artifact down with it — the sidecar is green on both arches today and
      # the Linux wrapper build is unproven.
      # ---------------------------------------------------------------------------

      # Derived from src-tauri/Cargo.lock *and* from what the Tauri CLI itself runs —
      # enumerated by process, not by dependency graph. Reading every
      # [package.metadata.system-deps] table and pkg_config probe in the 338-crate Linux
      # tree gives the first three; it differs from Tauri's prerequisites page two ways:
      # libxdo-dev is unnecessary (no xdo crate anywhere), libssl-dev is unnecessary (no
      # openssl-sys), and libdbus-1-dev is REQUIRED but absent from that page — tao pulls
      # libdbus-sys, which probes dbus-1 with plain pkg_config.
      #
      # libayatana-appindicator3-dev is the one a dependency-graph derivation CANNOT find,
      # and leaving it out is what reddened the first run on main (run 30805473925): the
      # Rust compile finished cleanly in 4m03s and then `cargo-tauri` aborted with exit 134,
      # `Can't detect any appindicator library`. The consumer is the CLI, which is a
      # prebuilt binary and therefore not in the lockfile at all —
      # pkgconfig_utils::get_appindicator_library_path (tauri-cli
      # crates/tauri-cli/src/interface/rust.rs:1711-1722) shells out to pkg-config for
      # ayatana-appindicator3-0.1, falls back to appindicator3-0.1, and panics when neither
      # .pc file exists. `libappindicator-sys` 0.9 having no build.rs is true and
      # irrelevant: it says nothing about what the bundler needs.
      # Caching the downloaded .debs, because the download is the whole problem.
      #
      # Measured across four runs this step took 23s, 23s, 27s — and then 24m 52s. Same
      # runner image, same package list, same mirror. apt's own summary for the slow one
      # reads `Fetched 56.3 MB in 24min 52s (37.8 kB/s)`, against 8,059 kB/s for the
      # index refresh *in the same job* and 8,121 kB/s for a later fetch. So it was one
      # degraded backend behind azure.archive.ubuntu.com's load-balanced pool, not the
      # runner's network.
      #
      # It logged zero errors, zero retries, zero timeouts — it was never stuck, only
      # slow, so `Acquire::Retries` and `Acquire::http::Timeout` would never have fired.
      # Timeouts catch stalls; nothing but not-downloading catches this.
      #
      # `actions/cache` rather than a third-party apt-cache action: the popular one
      # (awalsh128/cache-apt-pkgs-action) pipes a script from an unpinned `master`
      # branch into bash at install time, which is the exact pattern §10 of the bundle
      # design cites for avoiding AppImage. Pinning the action to a SHA would not help,
      # since the pinned code fetches master at runtime.
      #
      # Dir::Cache::archives points apt at a user-writable directory so the cache action
      # can read it without sudo. Bump the -v suffix to invalidate deliberately.
      - name: Cache the GTK and WebKit .debs
        if: env.BUNDLE == 'true'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-gtk-webkit-${{ matrix.runner }}-v1

      - name: Install the GTK and WebKit development headers
        if: env.BUNDLE == 'true'
        timeout-minutes: 12
        run: |
          set -eu
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-archives" \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev
          # apt runs as root, so the .debs land root-owned and actions/cache (running as
          # `runner`) cannot read them. Without this the cache silently saves nothing.
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          du -sh ~/apt-archives

      # NOT `mix ex_tauri.install`. That is the supported way to get this binary and the
      # wrong one here: it is Igniter-driven and regenerates src-tauri/src/main.rs from a
      # template, discarding the hand-injected ARMCHAIR_DESKTOP=1 that every desktop
      # config override keys off (docs/superpowers/2026-07-30-follow-ups.md, "Desktop
      # release env staleness"). This does the one thing that installer does which CI
      # needs: put a binary where ExTauri's `tauri_cli_path!()` looks for it.
      #
      # A prebuilt binary rather than `cargo install tauri-cli`, which compiles for
      # minutes. Pinned rather than following config/config.exs's floating `^2.5.1`: a
      # runner should be reproducible where a laptop may float. Bump this when that pin
      # moves. Note the asset only exists for x86_64 and riscv64gc — there is no
      # aarch64-unknown-linux-gnu build, which is half the reason for the arch gate above.
      #
      # Deliberately not guarded with `test -x`: _build is cached, and a guard would let
      # a CLI left by an older pin survive this bump silently.
      - name: Install the Tauri CLI
        if: env.BUNDLE == 'true'
        env:
          TAURI_CLI_VERSION: "2.11.4"
        run: |
          mkdir -p _build/_tauri/bin
          curl -fsSL -o /tmp/cargo-tauri.tgz \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          tar -xzf /tmp/cargo-tauri.tgz -C _build/_tauri/bin cargo-tauri
          _build/_tauri/bin/cargo-tauri --version

      # `--bundles deb` narrows tauri.conf.json's `"targets": "all"`, which on Linux would
      # also build rpm and AppImage. AppImage's bundler downloads five artefacts during
      # the build (appimage/linuxdeploy.rs), two of them from an unpinned `master` branch,
      # so it can break with no change to this repository and no advisory to explain it.
      # The config keeps "all" so a local macOS build still produces .app and .dmg.
      - name: Build the Linux bundle
        if: env.BUNDLE == 'true'
        run: mix ex_tauri.build --ci --bundles deb

      # The same script a laptop runs against a downloaded artifact — see its header for
      # why the assertions live there rather than inline here.
      - name: Verify the .deb
        if: env.BUNDLE == 'true'
        run: ./scripts/verify-deb.sh src-tauri/target/release/bundle

      # ---------------------------------------------------------------------------
      # The Flatpak, built from the .deb that now exists on disk a few lines above.
      #
      # In *this* job rather than one of its own, and the reason is not tidiness. A
      # separate job would have to consume the .deb as an artifact — and pushes to
      # main deliberately do not upload one, because that is what closes the route to
      # installing two same-version packages from CI. Building here needs no artifact,
      # so the Flatpak can be built and verified on every merge without reopening it.
      #
      # Measured on run 30904363993: apt 77s, runtime+SDK 50s (32 MB/s peak). An
      # earlier design excluded main pushes on an estimate of "1.5-2 GB, 6-12
      # minutes", which was wrong by about an order of magnitude and is why this now
      # runs wherever the .deb does.
      - name: Cache the Flatpak toolchain .debs
        if: env.BUNDLE == 'true'
        uses: actions/cache@v6
        with:
          path: ~/apt-archives-flatpak
          # v2: elfutils joined the package list. The key must move with the list,
          # because actions/cache only *saves* on a miss — a v1 hit would restore the
          # old set and quietly re-download elfutils on every run forever.
          key: apt-flatpak-${{ matrix.runner }}-v2

      # `elfutils` is listed explicitly, and that is not optional.
      #
      # flatpak-builder strips debug symbols from every binary by default, shelling out
      # to `eu-strip` — which lives in elfutils, a package flatpak-builder only
      # *recommends*. Adding --no-install-recommends here therefore broke the build
      # with `Failed to execute child process "eu-strip" (No such file or directory)`,
      # after the module had already been assembled. (`eu-elfcompress`, warned about a
      # line earlier in that log, is the same package.)
      #
      # Naming it beats dropping the flag: the install stays minimal, and the thing the
      # build actually needs is written down instead of arriving as a side effect of
      # someone else's recommends list. That is the same lesson §7 of the bundle design
      # records — enumerate build inputs by process, not by dependency graph.
      - name: Install the Flatpak toolchain
        if: env.BUNDLE == 'true'
        timeout-minutes: 12
        run: |
          set -eu
          mkdir -p ~/apt-archives-flatpak/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$HOME/apt-archives-flatpak" \
            flatpak flatpak-builder elfutils
          command -v eu-strip >/dev/null \
            || { echo "::error::eu-strip missing; flatpak-builder will fail after assembling the module"; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives-flatpak
          du -sh ~/apt-archives-flatpak

      # --user throughout: no privilege needed beyond the apt install above, and the
      # runtime lands somewhere the build can read.
      #
      # //50, not the //46 an earlier design proposed: GNOME 46 is built on
      # freedesktop-sdk 23.08, whose glibc (~2.37) is *older* than the
      # `libc6 (>= 2.39)` this .deb declares, so the app would die at the dynamic
      # loader while flatpak-builder exited 0 having merely copied files.
      - name: Install the GNOME runtime and SDK
        if: env.BUNDLE == 'true'
        run: |
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          time flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
          flatpak list --user --runtime

      # The manifest's source is `app.deb`, a fixed name, because the real filename
      # contains a space (Tauri builds it from productName) and a flatpak-builder
      # `path:` is not a glob. Staging beats quoting a space through YAML, sh and the
      # builder.
      - name: Stage the Flatpak sources
        if: env.BUNDLE == 'true'
        run: |
          set -eu
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' -type f | head -1)
          test -n "$DEB" || { echo "::error::no .deb to repackage"; exit 1; }
          cp "$DEB" packaging/flatpak/app.deb
          ls -la packaging/flatpak/

      # --disable-rofiles-fuse because FUSE is not available on a hosted runner;
      # without it flatpak-builder fails setting up its copy-on-write build directory.
      - name: Build the Flatpak
        if: env.BUNDLE == 'true'
        run: |
          set -eu
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo flatpak-build \
            packaging/flatpak/io.github.adsouza.armchair-metropolist.yml
          flatpak build-bundle flatpak-repo armchair-metropolist.flatpak \
            io.github.adsouza.armchair-metropolist
          ls -la armchair-metropolist.flatpak

      # The same script a laptop would run, except that it cannot: it installs and
      # executes a Flatpak, so it is Linux-only. See its header.
      # timeout-minutes as well as the script's own internal `timeout 180`, because the
      # first version of this step hung a job: `wait $PID` on a BEAM that does not exit
      # promptly on SIGTERM, inside a `flatpak run` that will not return until its child
      # tree is gone. Every bound was inside the sandbox, so when the sandbox would not
      # exit there was nothing left to stop it. Two independent bounds now.
      - name: Verify the Flatpak
        if: env.BUNDLE == 'true'
        timeout-minutes: 8
        run: ./scripts/verify-flatpak.sh armchair-metropolist.flatpak

      # The sweep runs the script three more times; bound it too.

      # Every assertion above, shown to fail. The standing rule here is that a check
      # which passes because it is doing nothing looks identical to one that passes
      # because it is satisfied — and verify-flatpak.sh cannot be mutated on a laptop,
      # so the sweep lives here where a Linux runner exists. One step, one run, and it
      # re-proves itself on every merge rather than once at review time.
      #
      # Assertion 7's *glibc* case is not here: falsifying it means rebuilding the whole
      # bundle against an older runtime, which is its own experiment. What is here is
      # assertion 7's plumbing — EXPECT_SIDECAR pointing at a path that does not exist
      # must turn it red, which is how we know it is wired to anything.
      - name: Prove the Flatpak checks can fail
        if: env.BUNDLE == 'true'
        timeout-minutes: 15
        run: |
          set -eu
          B=armchair-metropolist.flatpak
          for spec in \
            "EXPECT_APP_ID=io.github.adsouza.not-the-app" \
            "EXPECT_RUNTIME=org.gnome.Platform/x86_64/46" \
            "EXPECT_SIDECAR=/app/bin/nosuchbinary"
          do
            if env "$spec" ./scripts/verify-flatpak.sh "$B" >/dev/null 2>&1; then
              echo "::error::MUTATION SURVIVED: $spec — that assertion proves nothing"
              exit 1
            fi
            echo "ok: $spec turned it red"
          done
          echo "all mutations died; the unmutated run above was green"

      - name: Upload the Flatpak
        if: env.BUNDLE == 'true' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: armchair-metropolist.flatpak
          if-no-files-found: error
          retention-days: 14

      # Tag-only. On main the package is built, verified, and discarded: the
      # Release is the durable copy, and not publishing a .deb from main also
      # closes the route by which someone could install two *packages* carrying the
      # same version — the stale-Burrito-payload bug. (The per-merge *sidecar*
      # artifacts above are still uploaded and are still the same Burrito binary,
      # so that route stays open for them, deliberately: they are the only way to
      # test an unreleased merge.)
      #
      # workflow_dispatch also uploads, so a manual run leaves something downloadable
      # to inspect. That is a manual, deliberate act rather than a per-merge artifact.
      - name: Upload the Linux bundle
        if: env.BUNDLE == 'true' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: desktop-bundle-${{ matrix.target }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # Publishes what `desktop` built to a permanent, public Release. Only reachable
  # from a v* tag, which the `on:` block at the top is what admits.
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'

    # `needs: [check]` is load-bearing, not tidiness: without it a tag whose tests
    # fail still publishes. It is also where the tag-vs-version guard runs, so a
    # mismatched tag stops there. `needs: [desktop]` waits for *both* matrix legs,
    # so a broken aarch64 sidecar blocks the Release rather than yielding a partial
    # one.
    needs: [check, desktop]

    # The workflow default is `contents: read`, which cannot create a Release —
    # `gh release create` would fail with 403. Raised for this job alone rather
    # than workflow-wide, so no other job gains write access to the repository.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # v8 rather than v7: upload-artifact@v7 introduced direct (unzipped) uploads
      # behind an `archive: false` parameter this workflow does not set, so our
      # artifacts are still zipped and either major would read them. v8 is current,
      # understands both shapes, and defaults a download hash mismatch to *error*
      # where earlier majors only warned.
      #
      # No `name:`, so every artifact from this run lands under artifacts/<name>/.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Fail before `gh` does, with a message naming the missing file and showing
      # what actually arrived. A Release is public and permanent; a partial one is
      # worse than none.
      - name: Verify every asset arrived, and give each a sane filename
        run: |
          set -eu

          # Artifact names are internal wiring — `desktop-<triple>` is what the desktop
          # job happens to call them. Release asset names are the public interface: they
          # appear on the releases page, in download URLs, and in whatever command someone
          # pastes into a terminal. They are renamed here rather than at upload, because
          # the upload names are also what *this* job looks them up by.
          VERSION="${GITHUB_REF_NAME#v}"

          # The .deb. Tauri builds its filename from `productName`, so it arrives as
          # `Armchair Metropolist_<version>_amd64.deb` — a space that becomes %20 in every
          # URL. Tauri offers no override (debian.rs:60 uses settings.product_name()), and
          # changing productName would rename the macOS .app and its Dock label too, since
          # CFBundleDisplayName reads the same field (macos/app.rs:58, :220). Renaming the
          # asset is the whole fix: contents untouched, and the package's own `Package:`
          # field is already `armchair-metropolist`.
          DEB=$(find artifacts/desktop-bundle-x86_64-unknown-linux-gnu -name '*.deb' -type f | head -1)
          test -n "$DEB" || { echo "::error::no .deb in the bundle artifact"; find artifacts -type f; exit 1; }
          DEB_OUT="artifacts/armchair-metropolist_${VERSION}_amd64.deb"
          mv "$DEB" "$DEB_OUT"

          # The sidecars. `desktop_x86_64-unknown-linux-gnu` is accurate and tells a
          # visitor nothing: "desktop" is the Mix release's name, not a description, and
          # the file is in fact the *server* — it runs Phoenix with no window, which is
          # the reason to want it. Named to match the .deb's name_version_arch shape.
          for T in x86_64 aarch64; do
            SRC="artifacts/desktop-${T}-unknown-linux-gnu/desktop_${T}-unknown-linux-gnu"
            test -f "$SRC" \
              || { echo "::error::missing sidecar for $T"; find artifacts -type f; exit 1; }
            mv "$SRC" "artifacts/armchair-metropolist-server_${VERSION}_linux-${T}"
          done

          # The Flatpak. Built in the desktop job alongside the .deb it repackages, and
          # already verified there by running the app inside the sandbox, so by the time
          # it reaches here it is known to boot rather than merely to exist.
          FLATPAK="artifacts/flatpak-bundle/armchair-metropolist.flatpak"
          test -f "$FLATPAK" \
            || { echo "::error::missing flatpak bundle"; find artifacts -type f; exit 1; }
          FLATPAK_OUT="artifacts/armchair-metropolist_${VERSION}_x86_64.flatpak"
          mv "$FLATPAK" "$FLATPAK_OUT"

          # The version comes from the tag, which `check` has already proven equals the
          # version every file in the repository declares — so these names cannot claim a
          # version the artifacts are not.
          echo "DEB=$DEB_OUT" >> "$GITHUB_ENV"
          echo "FLATPAK=$FLATPAK_OUT" >> "$GITHUB_ENV"
          ls -la artifacts/armchair-metropolist*

      # --generate-notes composes the body from commits since the previous tag.
      # This repository squash-merges, so every line is already a readable PR title
      # and the notes need no maintenance.
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            "$DEB" \
            "$FLATPAK" \
            "artifacts/armchair-metropolist-server_${VERSION}_linux-x86_64" \
            "artifacts/armchair-metropolist-server_${VERSION}_linux-aarch64"

  # The Rust half of what `mix check` does for Elixir. `deps.audit` reads mix.lock
  # against published advisories; nothing has ever read src-tauri/Cargo.lock, which
  # pulls 493 crates — almost all of them transitively, through Tauri. The asymmetry
  # matters because the desktop target is a *redistributed binary*: a vulnerable crate
  # there ships to someone's machine.
  #
  # Deliberately its own job rather than a step in `mix check`. That alias earns its
  # keep by being one command a laptop and a runner run identically, and a step needing
  # a Rust toolchain would dilute it for everyone who only touches the web app.
  #
  # What it denies, and why RUSTSEC-2024-0429 is excepted, lives in
  # src-tauri/.cargo/audit.toml next to the entry itself. Settings are in that file
  # rather than in flags here so a laptop run behaves the same way.
  rust-advisory:
    name: rust advisory
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Not rustsec/audit-check: it declares `using: node20` at its latest tag (v2.0.0),
      # and setup-zig above is already an unavoidable node20 action with a comment
      # explaining that its deprecation warning cannot be silenced from here. A second,
      # avoidable one is a poor trade. install-action is `composite` — no Node runtime —
      # and fetches a prebuilt musl binary, so this takes seconds where
      # `cargo install cargo-audit --locked` takes about a minute of compilation.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # No toolchain setup and no build step above on purpose: cargo-audit reads
      # Cargo.lock, which is tracked, and never compiles the crate.
      #
      # This fetches RustSec's advisory database over the network on every run, and is
      # uncached on purpose — a stale database is the failure mode worth avoiding, and
      # like `deps.audit` this job can turn a green build red with no change to this
      # repository on the day an advisory lands. That is the point of it.
      - name: Audit the Rust dependencies
        working-directory: src-tauri
        run: cargo audit

  # Deploys the *server* target to Gigalixir. The desktop binaries above are a
  # separate product and are deliberately not a gate on this: they can fail
  # without the web app being any less deployable. The Rust advisory job is the
  # desktop wrapper's gate and follows the same rule.
  deploy:
    name: deploy to Gigalixir
    runs-on: ubuntu-24.04

    # "On green build" taken literally: depend on the real gate rather than
    # re-running a weaker copy of it here. The `check` job runs the suite against
    # a Postgres service on both supported Elixir versions; a bare `mix test` in
    # this job would have no database to talk to and would fail at `ecto.create`.
    needs: [check]

    # Never deploy from a pull request. This workflow triggers on `pull_request`
    # as well as pushes to main, so without this condition opening a PR from any
    # branch in this repository would push production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7
        with:
          # Deploying pushes this repository to Gigalixir's git remote, and a
          # shallow clone is rejected there with `shallow update not allowed`.
          # checkout defaults to depth 1.
          fetch-depth: 0

      # pipx rather than `pip install --user`: PEP 668 marks the runner's system
      # Python as externally managed, so a plain pip install can refuse outright.
      # pipx is preinstalled on GitHub's Ubuntu images and puts the CLI on PATH,
      # which also removes the need to call it by absolute path.
      - run: pipx install gigalixir

      # `gigalixir git:deploy` no longer exists — CLI 1.16.1 rejects it with
      # `No such command 'git:deploy'`, and every push to main since 2026-08-02
      # merged code without shipping a release. A deploy is now a plain git push,
      # which is what Gigalixir's own CI documentation describes.
      #
      # The three commands are one chain, and each depends on the one before:
      #
      #   1. `login` authenticates and writes ~/.netrc with the API key the
      #      server hands back — NOT the password. That file is the only thing
      #      that authenticates step 3.
      #   2. `git:remote` takes the app name POSITIONALLY (not `-a`, unlike most
      #      of this CLI) and adds `https://git.gigalixir.com/<app>.git/` with no
      #      credentials in the URL, which is why step 1 has to have run. It drops
      #      any existing `gigalixir` remote first, so it is safe to re-run.
      #   3. `git push` authenticates from ~/.netrc: git's curl backend reads it
      #      by default.
      #
      # `-f` and the explicit `HEAD:refs/heads/main` refspec both follow
      # Gigalixir's documented recipe. CI checks out a detached HEAD, so the
      # refspec is required to say which branch to deploy; the force is because
      # this remote is a deploy target rather than a source of truth, and a
      # rejected push there means an un-shipped release, not a saved mistake.
      - name: Deploy
        env:
          GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
          GIGALIXIR_PASSWORD: ${{ secrets.GIGALIXIR_PASSWORD }}
          APP_NAME: "armchair-metropolist"
        run: |
          gigalixir login -e "$GIGALIXIR_EMAIL" -p "$GIGALIXIR_PASSWORD" -y
          gigalixir git:remote "$APP_NAME"
          git push -f gigalixir HEAD:refs/heads/main
